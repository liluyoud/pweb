# O Traefik do Dokploy recebe o HTTPS e repassa para este nginx em HTTP.
# Estes "maps" preservam o protocolo e o IP original do visitante.
map $http_x_forwarded_proto $protocolo_publico {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $http_x_real_ip $ip_visitante {
  default $http_x_real_ip;
  ""      $remote_addr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Redirecionamentos relativos (/n2 → /n2/) mantêm o HTTPS do navegador.
  absolute_redirect off;

  # A importação de alunos do Controle N2 aceita arquivos de até 1 MB.
  client_max_body_size 2m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $protocolo_publico;
  proxy_set_header X-Real-IP $ip_visitante;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Página inicial
  location = / {
    try_files /index.html =404;
  }

  # Aula: slides em HTML estático (pasta web/ do repositório)
  location = /web {
    return 301 /web/;
  }

  location /web/ {
    try_files $uri $uri/ =404;
  }

  # Controle Acadêmico: site estático + API
  location = /avaliacao {
    return 301 /avaliacao/;
  }

  location /avaliacao/api/ {
    proxy_pass http://academico-api:3333/api/;
  }

  location /avaliacao/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # O React Router cuida das rotas: endereços desconhecidos voltam ao index.html.
  location /avaliacao/ {
    try_files $uri $uri/ /avaliacao/index.html;
  }

  # Controle N2: o próprio servidor Bun entrega páginas e API
  location = /n2 {
    return 301 /n2/;
  }

  location /n2/ {
    proxy_pass http://controle-n2:3400/;
  }
}
